version: 2
updates:
  # Keep npm dependencies current and get automatic PRs for vulnerabilities
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      # bundle all minor/patch bumps into ONE PR instead of one-per-package
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    # major version bumps (breaking changes) still get their own PR,
    # so you don't accidentally merge a major bump silently
    ignore:
      # pinned to 6.x on purpose — typescript-eslint doesn't support 7.x yet
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']

  # Keep the Dockerfile's base image current
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore'

  # Keep GitHub Actions themselves current
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'chore'
    groups:
      actions-all:
        patterns:
          - '*'
